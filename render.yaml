services:
  # ── API Server + Frontend (single service) ──────────────────────────────
  - type: web
    name: alpha-study
    runtime: node
    plan: free
    buildCommand: |
      cd server && npm install --include=dev && npm run build && cd ..
      npm install --include=dev && npm run build
      mkdir -p server/public
      cp -r dist/* server/public/
    startCommand: cd server && node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alpha-study-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
        secret: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://alphastudy.onrender.com,https://alphastudy.zone.id
      - key: LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ALOC_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

# ── PostgreSQL Database ──────────────────────────────────────────────────
databases:
  - name: alpha-study-db
    plan: free
    databaseName: alpha_study
    ipAllowList: []
